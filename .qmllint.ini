; Configuração do qmllint. Rode por `python tools/check_qml.py`, que é quem
; passa o import path — sem ele o `theme` não resolve e o relatório enche de
; erro que não existe.
;
; Só o que diverge do padrão está aqui. O resto do vocabulário de avisos vem do
; próprio qmllint, e é de propósito: assim regra nova dele chega ligada.

[General]
DisableDefaultImports=false
MaxWarnings=-1

[Warnings]
; O `backend` é context property — o único objeto que o Python expõe ao QML.
; O qmllint não tem como conhecê-lo: context property não tem tipo declarado
; em lugar nenhum, e é assim por construção, não por descuido. Ligado, ele
; produz ~313 avisos que são todos a mesma linha ("Unqualified access" em
; `backend.x`) e enterram os avisos de verdade — foi exatamente o que aconteceu
; numa auditoria, que reportou 569 deles e não viu os 2 que importavam.
;
; Desligar aqui é o que transforma o qmllint em ferramenta útil: o relatório
; volta a caber na tela, e o que sobra é sinal.
;
; O preço é conhecido: erro de digitação em nome de propriedade do backend não
; é pego por aqui. Quem pega é `tools/simular_uso.py`, que exercita a UI de
; verdade. Para acabar com o preço seria preciso expor o backend como singleton
; QML em vez de context property — mexeria nos 17 arquivos .qml, e a decisão
; ainda não foi tomada.
UnqualifiedAccess=disable

; Mesma causa, mesma razão: este avisa que context property está sendo usada.
; Está mesmo, e é a arquitetura descrita no CLAUDE.md.
ContextProperties=disable
