[pytest]
# A suite inteira vive em tests/. Sem esta linha, `python -m pytest` sem
# argumento varre o rootdir inteiro e entra em portatil/, dist/ e build/, que
# sao saida de ferramenta e nao codigo deste projeto -- o portatil chega a ter
# um Python embeddable com o PySide6 dentro, e a coleta morre ali antes de
# rodar um teste sequer.
testpaths = tests

# testpaths so vale quando nao ha caminho na linha de comando. Isto aqui cobre
# o resto: `pytest -k planta` continua limitado, e um `pytest .` distraido
# tambem.
norecursedirs = .venv build dist portatil assets docs .git

# As duas marcas de sistema. Quem nao tem marca nenhuma roda em qualquer lugar,
# que e o caso de quase tudo; estas duas dizem "este teste so existe aqui", e o
# conftest tira da coleta o que for do outro sistema em vez de pular. O porque
# esta em tests/checklist.py.
markers =
    posix: so no sistema POSIX -- depende de caminho ou permissao de verdade
    windows: so no Windows -- depende de API ou caminho que so existe la

# Marca escrita errada e teste que passa a rodar em todo lugar sem ninguem
# notar, que e justamente o defeito silencioso que a filtragem existe para
# evitar. Com isto, um "@pytest.mark.linux" distraido para a suite na hora.
addopts = --strict-markers
